name: seg5-diag

on:
  push:
    branches:
      - fix/seg5-build-marker-scope

permissions:
  contents: write

jobs:
  diag:
    if: "!contains(github.event.head_commit.message, '[seg5-diag]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build structure report
        run: node .github/seg5-diag.mjs
      - name: Commit report
        run: |
          git config user.name "bse-ci-bot"
          git config user.email "bse-ci-bot@users.noreply.github.com"
          git add artifacts
          git commit -m "chore: seg5 structure report [seg5-diag]"
          git push origin HEAD:fix/seg5-build-marker-scope
