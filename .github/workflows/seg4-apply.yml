name: seg4 apply
on:
  push:
    branches: [fix/seg4-unknown-alignment]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/seg4-patch.mjs
      - run: node --test tests/seg3-display.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/seg3-display.test.mjs
          git commit -m "[seg4-auto] fix: BSE 3.6.5 effective date copy and official link"
          git push
